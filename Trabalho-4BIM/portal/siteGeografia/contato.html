<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="JavaScript/script.js" defer></script>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
   <!-- Cabeçalho principal do site -->
<header>
    <!-- Coloque aqui o logotipo, o título do site ou um banner principal -->
    
    <!-- Menu de navegação global -->
    <nav>
        <!-- Insira os links das suas outras páginas aqui -->
    </nav>
</header>

<!-- Conteúdo principal e exclusivo desta página -->
<main>

    <!-- Seção de destaque ou bloco principal -->
    <section>
        
        <!-- Conteúdo autônomo (ex: um post de blog, um artigo, uma notícia) -->
        <article>
            <!-- Títulos, parágrafos, imagens do seu artigo ficam aqui -->
        </article>

        <article>
            <!-- Outro post ou item de conteúdo independente -->
        </article>

    </section>

    <!-- Outra seção temática do site (ex: Serviços, Sobre, Contato) -->
    <section>
        <!-- Conteúdo da segunda seção -->
    </section>

    <!-- Barra lateral com conteúdos relacionados ou secundários -->
    <aside>
        <!-- Widgets, links adicionais, anúncios ou redes sociais -->
    </aside>

</main>



<!-- Rodapé principal do site -->
<footer>
    <!-- Informações de direitos autorais, links legais ou contato -->
</footer>


</body>
</html>
